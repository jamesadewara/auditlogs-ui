name: Build and publish ARM64 image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  security-events: write

jobs:
  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Validate Docker Hub and API URL configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AUTH_API_URL: ${{ vars.AUDITLOGS_UI_AUTH_API_URL }}
          AUDIT_API_URL: ${{ vars.AUDITLOGS_UI_AUDIT_API_URL }}
        run: |
          set -euo pipefail
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]] || {
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          }
          [[ "$AUTH_API_URL" =~ ^https://[^[:space:]]+$ ]] || {
            echo "::error::Set AUDITLOGS_UI_AUTH_API_URL to the HTTPS base URL for the Auth API."
            exit 1
          }
          [[ "$AUDIT_API_URL" =~ ^https://[^[:space:]]+$ ]] || {
            echo "::error::Set AUDITLOGS_UI_AUDIT_API_URL to the HTTPS base URL for the Audit API."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/auditlogs-ui
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=AuditLogs UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AUTH_API_URL=${{ vars.AUDITLOGS_UI_AUTH_API_URL }}
            VITE_AUDIT_API_URL=${{ vars.AUDITLOGS_UI_AUDIT_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Report published image digest
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Published image: \`${DOCKERHUB_USERNAME}/auditlogs-ui@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/auditlogs-ui@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload scan results
        if: always() && hashFiles('trivy-results.sarif')
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/auditlogs-ui@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: auditlogs-ui-sbom
          path: sbom.spdx.json
