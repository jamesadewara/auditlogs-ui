name: AuditLogs UI CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build with non-routable test API URLs
        env:
          VITE_AUTH_API_URL: https://auth.auditlogs.invalid
          VITE_AUDIT_API_URL: https://api.auditlogs.invalid
        run: bun run build
